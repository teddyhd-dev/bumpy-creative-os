name: checks
# Runs the repo's sensor on every push and pull request: contracts, links, append-only history.
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate the brain against the contracts
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then BASE="origin/${{ github.base_ref }}";
          elif git rev-parse -q --verify HEAD~1 >/dev/null; then BASE="HEAD~1"; else BASE="HEAD"; fi
          python checks/validate.py --base "$BASE"
